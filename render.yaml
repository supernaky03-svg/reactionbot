services:
  - type: web
    name: thinking-auto-reaction
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.health:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: USERBOT_API_ID
        sync: false
      - key: USERBOT_API_HASH
        sync: false
      - key: USERBOT_SESSION
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
